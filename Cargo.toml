[package]
name = "camera-kelp-demo"
version = "0.1.0"
edition = "2021"
authors = ["Mike Purvis"]
description = "Audio-reactive camera effects with kelp-like strands - Metal GPU demo for macOS"

[features]
default = []
audio = ["cpal"]

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
metal = "*"
minifb = "0.25.0"
nokhwa = { version = "0.10.0", features = ["input-avfoundation"] }
cpal = { version = "0.15", optional = true }
cocoa = "0.24"
objc = "0.2"
core-graphics = "0.23"

